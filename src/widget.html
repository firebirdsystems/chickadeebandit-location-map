<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Location Map</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <script src="./vendor/leaflet/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #000000);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--hub-text-muted, #6b7280);
      font-size: 12px;
      text-align: center;
      padding: 16px;
    }
    .empty-icon { font-size: 28px; opacity: 0.5; }

    /* A place pin is the zone, not the person: squared off so it never reads
       as a live position. */
    .member-marker.place { border-radius: 8px; border-style: dashed; }
    .member-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      font-size: 13px;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="empty" class="empty" style="display:none">
  <div class="empty-icon">📍</div>
  <div>No locations shared yet</div>
</div>

<script type="module">
import { memberColor, initial, esc, pinnable, isPlace, popupLines } from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";

async function load() {
  const ctxRes = CONTEXT ? await fetch(`${CONTEXT}?keys=family.members,family.locations`) : null;
  const ctx = ctxRes?.ok ? await ctxRes.json() : {};

  const rows = ctx["family.locations"] ?? [];
  const locations = Array.isArray(rows) ? rows.filter(pinnable) : [];
  const members = ctx["family.members"] ?? [];
  const memberMap = new Map(members.map(m => [m.id, m]));

  if (locations.length === 0) {
    document.getElementById("map").style.display = "none";
    document.getElementById("empty").style.display = "flex";
    return;
  }

  const map = L.map("map", { zoomControl: false, attributionControl: false });
  // Tiles come from the hub, not straight from OSM. Their tile usage policy
  // disallows both halves of what this used to send — the deprecated {s}
  // sharding subdomains, and a client with no identifying User-Agent, which a
  // browser cannot supply — and every map in the product was being served
  // their "blocked" image instead of a tile. The hub proxy adds the User-Agent
  // and a shared cache in front of the upstream. Root-relative on purpose: the
  // same URL resolves whether this app is framed under /run/:appId on the hub
  // origin or served from its own {appId}.apps.* origin.
  L.tileLayer("/api/tiles/{z}/{x}/{y}", {
    maxZoom: 19,
  }).addTo(map);

  const bounds = [];

  for (const loc of locations) {
    const member = memberMap.get(loc.familyMemberId);
    const name = member?.name ?? "Unknown";
    const color = memberColor(loc.familyMemberId);
    const lat = loc.lat, lng = loc.lng;
    bounds.push([lat, lng]);

    const icon = L.divIcon({
      className: "",
      html: `<div class="member-marker${isPlace(loc) ? " place" : ""}" style="background:${esc(color)}">${esc(initial(name))}</div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16],
      popupAnchor: [0, -18],
    });

    const { primary, secondary } = popupLines(loc);
    const popup = `
      <strong>${esc(name)}</strong>
      ${primary ? `<br><span style="font-size:11px;color:#6b7280">${esc(primary)}</span>` : ""}
      ${secondary ? `<br><span style="font-size:11px;color:#9ca3af">${esc(secondary)}</span>` : ""}
    `;

    L.marker([lat, lng], { icon }).addTo(map).bindPopup(popup);
  }

  if (bounds.length === 1) {
    map.setView(bounds[0], 13);
  } else {
    map.fitBounds(bounds, { padding: [16, 16] });
  }
}

load().catch(() => {
  document.getElementById("map").style.display = "none";
  document.getElementById("empty").style.display = "flex";
});

setTimeout(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
